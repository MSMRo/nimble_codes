[project]
name = "nimble-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "langchain>=1.4.6",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.10",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.15",
    "matplotlib>=3.11.2",
    "notebook>=7.6.3",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.14.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.1.4",
    "sympy>=1.14.0",
    "typesafe-sdk>=0.7.5",
]

[project.scripts]
nimble-rag = "nimble_rag:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
